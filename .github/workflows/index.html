<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新年行大运 - 手势抽签</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 摄像头画面 -->
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" class="canvas-overlay"></canvas>
            <div class="camera-hint">摄像头</div>
        </div>

        <!-- 标题 -->
        <h1 class="title">6月运势抽签</h1>
        <p class="subtitle">手势抽签</p>

        <!-- 提示文字 -->
        <div class="hint-container">
            <p id="hint-text">请伸出手掌</p>
        </div>

        <!-- 倒计时进度条 -->
        <div class="countdown-container" id="countdown-container">
            <div class="countdown-ring">
                <svg width="120" height="120">
                    <circle class="countdown-bg" cx="60" cy="60" r="55" />
                    <circle class="countdown-progress" id="countdown-progress" cx="60" cy="60" r="55" />
                </svg>
                <div class="countdown-number" id="countdown-number">3</div>
            </div>
        </div>

        <!-- 抽签桶 -->
        <div class="bucket-container">
            <div class="bucket">
                <div class="bucket-lid"></div>
                <div class="bucket-body">
                    <div class="bucket-decoration"></div>
                </div>
                <div class="bucket-base"></div>
            </div>
            <div class="bucket-shadow"></div>
        </div>

        <!-- 签卡 -->
        <div class="card-container" id="card-container">
            <div class="card" id="card">
                <div class="card-front">
                    <div class="card-red-tape"></div>
                    <div class="card-title" id="card-title">抽签</div>
                    <div class="card-lucky" id="card-lucky"></div>
                    <div class="card-text" id="card-text"></div>
                </div>
                <div class="card-back">
                    <div class="card-pattern"></div>
                </div>
            </div>
        </div>

        <!-- 再抽一签按钮 -->
        <button class="draw-button" id="draw-button" style="display: none;">再抽一签</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
